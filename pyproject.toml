[project]
name = "falconfox"
version = "0.1.0"
description = "A small vendor-neutral ACP session daemon for remote agent work."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "agent-client-protocol>=0.10.1",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.21",
]

# Tests only. `uv sync` installs this by default, so `uv run pytest` works in a
# checkout with no further ceremony; the deployments pass --no-dev, since a
# running daemon has no use for a test runner.
[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
falconfox = "falconfox.cli:main"
falconfox-telegram = "falconfox_telegram.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falconfox", "src/falconfox_telegram"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
